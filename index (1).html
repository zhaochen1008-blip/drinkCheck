<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今儿您喝了吗？</title>
<link rel="manifest" href="./manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
body{background:#f0f6fc;padding:16px;display:flex;justify-content:center;}
.wrap{background:#ffffff;border-radius:24px;width:100%;max-width:700px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
h2{color:#222;font-size:28px;text-align:center;margin-bottom:6px;}
.subtitle{color:#777;font-size:15px;text-align:center;margin-bottom:20px;}
.continue-text{font-size:22px;font-weight:bold;margin:8px 0;text-align:center;color:#444;}
.best-record{font-size:17px;color:#27ae60;text-align:center;margin-bottom:20px;}

/* 打卡选项区域 */
.choose-drink-state{
  display:flex;gap:12px;margin-bottom:16px;
}
.state-btn{
  flex:1;padding:14px;border-radius:12px;border:none;font-size:17px;font-weight:bold;cursor:pointer;
}
.state-drank{background:#e74c3c;color:#fff;}
.state-notdrank{background:#27ae60;color:#fff;}

/* 酒类型下拉，默认隐藏 */
.select-wrap{margin-bottom:20px;display:none;}
#drinkType{width:100%;padding:12px;font-size:16px;border-radius:12px;border:1px solid #ddd;background:#fff;}

/* 统计行 */
.stat-row{display:flex;gap:12px;margin-bottom:16px;}
.stat-item{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:#f7f8fa;}
.stat-label{font-size:13px;color:#555;margin-bottom:6px;}
.stat-num{font-size:24px;font-weight:bold;}

/* 日历 */
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.calendar-btn{padding:4px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:15px;cursor:pointer;}
.calendar-title{font-size:18px;color:#333;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.c-day{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:14px;background:#eee;cursor:pointer;}
.c-day:hover{opacity:0.85;}
.green{background:#27ae60;color:#fff;}
.red{background:#e74c3c;color:#fff;}
.empty{background:#f3f3f3;color:#aaa;}
/* 选中要补打卡的日期高亮 */
.active-day{outline:2px solid #3498db;outline-offset:2px;}

.bottom-tip{color:#666;font-size:13px;margin-top:20px;text-align:center;line-height:1.5;}

/* 手机适配 */
@media (max-width:480px) {
    body{padding:8px;}
    .wrap{padding:16px;}
    h2{font-size:24px;}
    .continue-text{font-size:20px;}
    .choose-drink-state{gap:8px;}
    .state-btn{padding:12px;font-size:16px;}
}
</style>
</head>
<body>
<div class="wrap">
    <h2>今儿您喝了吗？</h2>
    <div class="subtitle">众人皆醉唯我断片</div>

    <div class="continue-text" id="continueInfo">还没有打卡记录</div>
    <div class="best-record" id="bestRecord">历史最高戒断天数：0 天</div>

    <!-- 第一步：选择喝了 / 没喝 -->
    <div class="choose-drink-state">
        <button class="state-btn state-drank" onclick="setDrinkState(1)">🍻 今儿喝了</button>
        <button class="state-btn state-notdrank" onclick="setDrinkState(0)">✅ 今儿没喝</button>
    </div>

    <!-- 第二步：酒类型下拉框，仅在【今儿喝了】时显示 -->
    <div class="select-wrap" id="drinkSelectBox">
        <select id="drinkType">
            <option value="">今天喝的什么酒？</option>
            <option value="白酒">白酒</option>
            <option value="啤酒">啤酒</option>
            <option value="红酒">红酒</option>
            <option value="洋酒">洋酒</option>
            <option value="三中全会">三中全会</option>
        </select>
    </div>

    <!-- 本月统计 -->
    <div class="stat-row">
        <div class="stat-item">
            <div class="stat-label">本月喝酒</div>
            <div class="stat-num" id="drinkCount">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">本月未喝酒</div>
            <div class="stat-num" id="noDrinkCount">0</div>
        </div>
    </div>

    <!-- 日历区域，点击日期补打卡 -->
    <div class="calendar-header">
        <button class="calendar-btn" onclick="prevMonth()">◀</button>
        <div class="calendar-title" id="calTitle"></div>
        <button class="calendar-btn" onclick="nextMonth()">▶</button>
    </div>
    <div class="calendar-grid" id="calendar"></div>

    <p class="bottom-tip">💡 提示：点击日历任意日期可补打卡；数据保存在本机浏览器，不会上传</p>
</div>
<script>
const storageKeyRecord = "drinkRecords";
const storageBestRecord = "bestQuitDay";
let records = {};
let bestQuitDays = 0;
let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let selectDate = ""; // 当前选中的打卡日期（默认今天，点日历可切换）
let currentPickState = null; // 0=没喝，1=喝了

// 吐槽文案
const tauntList = [
    "不喝不难受吗？",
    "就这？一口都不碰？",
    "别人都在喝，你确定扛得住？",
    "今晚饭局，真能忍住？",
    "少喝一点没事吧，这么较真？",
    "不喝酒，人生还有什么乐趣？",
    "再坚持看看，看你能撑几天。"
];

window.onload = function(){
    selectDate = getTodayStr();
    const recStr = localStorage.getItem(storageKeyRecord);
    if(recStr) records = JSON.parse(recStr);
    const savedBest = localStorage.getItem(storageBestRecord);
    if(savedBest) bestQuitDays = parseInt(savedBest);
    renderCalendar();
    calcContinueDays();
    renderBestRecord();
}

// 选择【喝了/没喝】
function setDrinkState(state){
    currentPickState = state;
    // 只有喝了才展示酒类型下拉
    const drinkBox = document.getElementById("drinkSelectBox");
    if(state === 1){
        drinkBox.style.display = "block";
    }else{
        drinkBox.style.display = "none";
    }
    saveCheckIn(state);
}

// 保存打卡记录（支持今天+过往补打卡）
function saveCheckIn(state){
    let drinkTypeVal = "无";
    if(state === 1){
        const drinkSelect = document.getElementById("drinkType");
        drinkTypeVal = drinkSelect.value;
        if(!drinkTypeVal){
            alert("请选择喝的酒类型！");
            return;
        }
        alert("每天在不喝和少喝之间，选择不少喝");
    }else{
        const randomTxt = tauntList[Math.floor(Math.random() * tauntList.length)];
        alert(randomTxt);
    }
    records[selectDate] = {status:state, type:drinkTypeVal};
    saveRecords();
    renderCalendar();
    calcContinueDays();
}

// 点击日历日期，切换为补打卡日期
function pickDay(y,m,d){
    selectDate = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    alert(`选中【${selectDate}】，请选择今儿喝了/没喝完成补打卡`);
    renderCalendar();
}

function getTodayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
}
function saveRecords(){
    localStorage.setItem(storageKeyRecord, JSON.stringify(records));
}
function renderBestRecord(){
    document.getElementById("bestRecord").innerText = `历史最高戒断天数：${bestQuitDays} 天`;
}

// 计算连续天数
function calcContinueDays(){
    let continueDay = 0;
    let lastStatus = null;
    const now = new Date();
    for(let i = 0; i < 1000; i++){
        const checkDate = new Date(now);
        checkDate.setDate(now.getDate() - i);
        const dateStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth()+1).padStart(2,'0')}-${String(checkDate.getDate()).padStart(2,'0')}`;
        if(!records.hasOwnProperty(dateStr)) break;
        const status = records[dateStr].status;
        if(lastStatus === null){
            lastStatus = status;
            continueDay = 1;
        }else if(status === lastStatus){
            continueDay++;
        }else{
            break;
        }
    }
    const el = document.getElementById("continueInfo");
    if(lastStatus === 1){
        el.innerText = `您已连续喝酒${continueDay}天`;
        el.style.color="#e74c3c";
    }else if(lastStatus === 0){
        el.innerText = `您已连续${continueDay}天没喝酒`;
        el.style.color="#27ae60";
        if(continueDay > bestQuitDays){
            bestQuitDays = continueDay;
            localStorage.setItem(storageBestRecord,bestQuitDays);
            renderBestRecord();
        }
    }else{
        el.innerText = "还没有打卡记录";
        el.style.color="#444";
    }
}

function prevMonth(){
    viewMonth--;
    if(viewMonth < 0){
        viewMonth = 11;
        viewYear--;
    }
    renderCalendar();
}
function nextMonth(){
    viewMonth++;
    if(viewMonth > 11){
        viewMonth = 0;
        viewYear++;
    }
    renderCalendar();
}

// 渲染日历，增加点击事件，补打卡
function renderCalendar(){
    const y = viewYear;
    const m = viewMonth;
    document.getElementById("calTitle").innerText = `${y}年${m+1}月`;
    const firstDay = new Date(y,m,1);
    const lastDay = new Date(y,m+1,0);
    const totalDays = lastDay.getDate();
    let html = "";
    const weekStart = firstDay.getDay();
    for(let i=0;i<weekStart;i++){
        html += `<div class="c-day empty"></div>`;
    }
    let drinkCnt=0,noDrinkCnt=0;
    for(let d=1;d<=totalDays;d++){
        const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let cls = "c-day";
        let tipText = "";
        if(records[dateStr]){
            if(records[dateStr].status===1){
                cls += " red";
                drinkCnt++;
                tipText = records[dateStr].type;
            }else if(records[dateStr].status===0){
                cls += " green";
                noDrinkCnt++;
                tipText = "未饮酒";
            }
        }
        // 选中补打卡日期高亮
        if(dateStr === selectDate){
            cls += " active-day";
        }
        html += `<div class="${cls}" title="${tipText}" onclick="pickDay(${y},${m},${d})">${d}</div>`;
    }
    document.getElementById("calendar").innerHTML = html;
    document.getElementById("drinkCount").innerText = drinkCnt;
    document.getElementById("noDrinkCount").innerText = noDrinkCnt;
}
</script>
</body>
</html>
